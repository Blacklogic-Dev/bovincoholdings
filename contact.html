<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact | Bonvinco Holdings</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #00d4ff; /* Tactical Cyan */
  --bg-dark: #050505; /* Pure Black */
  --card-bg: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.1);
  --text-dim: #888;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background-color: var(--bg-dark);
  color: #ffffff;
  line-height: 1.6;
}

/* ================= Drawer Navigation ================= */
.drawer-toggle {
  position: fixed;
  top: 25px;
  right: 25px;
  z-index: 10000;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  color: #fff;
  font-size: 1.2rem;
  padding: 12px 15px;
  border-radius: 4px;
  cursor: pointer;
  transition: 0.3s;
}

.drawer {
  position: fixed;
  top: 0;
  right: -280px;
  height: 100%;
  width: 280px;
  background: rgba(5, 5, 5, 0.98);
  display: flex;
  flex-direction: column;
  padding: 100px 40px;
  gap: 25px;
  z-index: 9999;
  border-left: 1px solid var(--border);
  transition: right 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
}

.drawer.open { right: 0; }

.drawer-item {
  color: #fff;
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  gap: 15px;
  transition: 0.3s;
}

.drawer-item i { color: var(--accent); }

/* ================= HERO ================= */
.hero {
  height: 50vh;
  background:
    linear-gradient(to bottom, rgba(5,5,5,0.4), var(--bg-dark)),
    url("call.jpg") center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

/* Grid Overlay */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(var(--border) 1px, transparent 1px),
                    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(circle, black, transparent 80%);
}

.hero h1 {
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 900;
  letter-spacing: -2px;
  margin: 0;
  background: linear-gradient(to bottom, #fff, #666);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  z-index: 1;
}

/* ================= CONTAINER & CARDS ================= */
.container {
  max-width: 1200px;
  margin: -80px auto 80px;
  padding: 0 30px;
  position: relative;
  z-index: 2;
}

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 30px;
}

@media (min-width: 992px) { .grid { grid-template-columns: 1fr 1.2fr; } }

.card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border-radius: 4px;
  padding: 50px;
  border: 1px solid var(--border);
  transition: 0.3s;
}

.card:hover { border-color: rgba(255,255,255,0.2); }

.card h2 {
  font-size: 1.5rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-top: 0;
  margin-bottom: 30px;
  color: var(--accent);
}

/* ================= CONTACT INFO ================= */
.info-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 25px;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--border);
}

.info-left {
  display: flex;
  align-items: center;
  gap: 15px;
  font-size: 0.9rem;
  color: #fff;
}

.info-left i { color: var(--accent); font-size: 1.1rem; }

.copy-btn {
  background: rgba(255,255,255,0.05);
  border: none;
  color: var(--accent);
  cursor: pointer;
  padding: 8px;
  border-radius: 4px;
  transition: 0.3s;
}

.copy-btn:hover { background: var(--accent); color: var(--bg-dark); }

.address { margin-top: 30px; color: var(--text-dim); font-size: 0.85rem; }

/* ================= FORM ================= */
.form-group { margin-bottom: 20px; }

label {
  display: block;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 8px;
}

input, textarea {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  padding: 15px;
  color: white;
  font-family: inherit;
  border-radius: 4px;
  transition: 0.3s;
}

input:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: rgba(255,255,255,0.07);
}

.submit-btn {
  background: white;
  color: black;
  border: none;
  padding: 18px;
  width: 100%;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 2px;
  border-radius: 4px;
  cursor: pointer;
  transition: 0.4s;
  margin-top: 10px;
}

.submit-btn:hover {
  background: var(--accent);
  box-shadow: 0 10px 20px rgba(0, 212, 255, 0.2);
}

/* SOCIALS */
.social-links {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 50px;
}

.social-links a {
  color: #444;
  font-size: 1.5rem;
  transition: 0.3s;
}

.social-links a:hover { color: var(--accent); transform: translateY(-3px); }

/* ================= FOOTER ================= */
footer {
  padding: 40px;
  text-align: center;
  font-size: 0.7rem;
  color: #444;
  text-transform: uppercase;
  letter-spacing: 2px;
  border-top: 1px solid var(--border);
}
</style>
</head>

<body>

<!-- Drawer Toggle -->
<button id="drawerToggle" class="drawer-toggle">
  <i class="fas fa-bars"></i>
</button>

<!-- Drawer -->
<nav class="drawer" id="drawer">
  <a href="index.html" class="drawer-item"><i class="fas fa-home"></i> Home</a>
  <a href="service.html" class="drawer-item"><i class="fas fa-cog"></i> Services</a>
  <a href="about.html" class="drawer-item"><i class="fas fa-shield-alt"></i> About</a>
  <a href="progress.html" class="drawer-item"><i class="fas fa-file-contract"></i> Legal</a>

<!-- HERO -->
<section class="hero">

<!-- CONTENT -->
<section class="container">
  <div class="grid">

    <!-- CONTACT DETAILS -->
    <div class="card">
      <h2>Strategic Comms</h2>

      <div class="info-item">
        <div class="info-left">

        <button class="copy-btn" onclick="copyText('bovincoholdings@gmail.com')">
          <i class="fas fa-copy"></i>
        </button>
      </div>

      <div class="info-item">
        <div class="info-left">
          <i class="fas fa-user-shield"></i>
          <span>admin@bovinco.com</span>
        </div>
        <button class="copy-btn" onclick="copyText('admin@bovinco.com')">
          <i class="fas fa-copy"></i>
        </button>
      </div>

      <div class="info-item">
        <div class="info-left">
          <i class="fas fa-phone"></i>
          <span>Ermelo: 087 149 4670</span>
        </div>
        <button class="copy-btn" onclick="copyText('0871494670')">
          <i class="fas fa-copy"></i>
        </button>
      </div>

      <div class="info-item">
        <div class="info-left">
          <i class="fas fa-phone"></i>
          <span>Witbank: 068 691 1235</span>
        </div>
        <button class="copy-btn" onclick="copyText('0686911235')">
          <i class="fas fa-copy"></i>
        </button>
      </div>

      <div class="address">
        <i class="fas fa-location-dot" style="color: var(--accent); margin-right: 10px;"></i>
        4b, 9 Corridor Cres, Ben Fleur, eMalahleni, 1034
      </div>
    </div>

    <!-- FORM -->
    <div class="card">
      <h2>Submit Enquiry</h2>

      <div class="form-group">
        <label>Full Identity</label>
        <input type="text" placeholder="John Doe">
      </div>

      <div class="form-group">

  </div>
  
  <!-- SOCIAL -->
  <div class="social-links">
    <a href="https://www.facebook.com/profile.php?id=61586572542499"><i class="fab fa-facebook"></i></a>
    <a href="https://www.instagram.com/bovincoholdings"><i class="fab fa-instagram"></i></a>

</section>

<footer>
  &copy; 2026 Bovinco Holdings | Engineered by BlackLogic Technologies
</footer>

<script>
const toggle = document.getElementById("drawerToggle");
const drawer = document.getElementById("drawer");

toggle.addEventListener("click", () => {
  drawer.classList.toggle("open");
  const icon = toggle.querySelector('i');
  icon.classList.toggle('fa-bars');
  icon.classList.toggle('fa-times');
});

function copyText(text) {
  navigator.clipboard.writeText(text);
  // Custom toast logic could go here
}

document.addEventListener('click', (e) => {
  if (!drawer.contains(e.target) && !toggle.contains(e.target)) {
    drawer.classList.remove('open');
    const icon = toggle.querySelector('i');
    icon.classList.add('fa-bars');
    icon.classList.remove('fa-times');
  }
});
</script>

</body>
</html>
